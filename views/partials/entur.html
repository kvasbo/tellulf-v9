{{define "entur" -}}
	<strong>Neste baner</strong>
	<table class="footerTable">
		<tbody>
			{{- range .}}
			<tr>
				<td class="number">{{.Time}}{{if .Dot}} <span class="train-dot train-dot-{{.Dot}}"></span>{{end}}</td>

			{{- end}}
		</tbody>
	</table>
{{- end}}
