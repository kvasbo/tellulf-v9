name: Check client code

on:
  push:
    branches:
      - "*"

jobs:
  biome:
    runs-on: ubuntu-latest
    name: Lint and format (Biome)
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15
      - name: Run Biome
        run: biome ci
