name: Build and push to Github Container Registry

on:
  push:
    branches:
      - "*" # Pushes to any branch
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Lint, build and push
    permissions:
      contents: read
      packages: write
    env:
      # The same on every step, so the build reuses what the tests compiled.
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
      GOOS: linux
      GOARCH: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go, with its cache
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Regenerated so the build never uses stale generated code.
      - name: Generate templates
        run: go generate ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Compile
        run: >-
          go build
          -ldflags="-s -w -X github.com/kvasbo/tellulf-v9/internal/buildinfo.Time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -o dist/tellulf .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref, event=branch
            type=sha
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
